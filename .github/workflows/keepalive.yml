# Keeps the free Supabase project from pausing (free projects pause after about a week with too
# little activity). Twice a day it calls the public, read-only landing-page function, which is
# the same request any visitor's browser makes. Uses the same two repository Variables as pages.yml.
# Note: GitHub stops scheduled workflows in a repo with no commits for 60 days, so this covers the
# run-up to Nov 20 but should not be relied on long-term. You can delete this file after the event.
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 11,23 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call public_landing
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          [ -n "$SUPABASE_URL" ] || { echo "SUPABASE_URL variable not set"; exit 0; }
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$SUPABASE_URL/rest/v1/rpc/public_landing" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code"
          [ "$code" = "200" ] || { echo "::error::Supabase did not answer 200 (paused?). Resume it in the dashboard."; exit 1; }
